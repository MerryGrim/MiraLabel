{
  "name": "RU · Проверка печати NIIMBOT",
  "description": "Успех, частичный результат, ошибка или ещё не проверено.",
  "title": "[Проверка печати] ",
  "labels": [
    "compatibility-report",
    "needs-review"
  ],
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Спасибо за проверку. Вставьте безопасный отчёт из приложения — повторно заполнять его поля не нужно. Если приложения под рукой нет, можно описать результат вручную. Ответ протокола не доказывает физическую печать. Новое Issue остаётся на проверке и не меняет совместимость автоматически.\n\n**Это публичная форма GitHub.** Не прикладывайте серийный номер, Bluetooth/MAC-адрес, имя компьютера, пути к файлам, журналы с такими данными или личные этикетки."
      }
    },
    {
      "type": "textarea",
      "id": "report",
      "attributes": {
        "label": "Отчёт из приложения или ручное описание",
        "placeholder": "Вставьте JSON из приложения. Либо укажите вручную: версия приложения; модель и числовой ID (если известен); прошивка; версия протокола; BLE/другое подключение; размер и тип бумаги; дата теста; была ли попытка печати; вышла ли ровно одна целая этикетка; виден ли весь текст; читается ли QR как MIRA-D11H-TEST. Для неизвестного напишите «не проверено».",
        "description": "Нажмите в приложении «Открыть форму GitHub»: безопасный JSON появится здесь автоматически. Если поля нет, сохраните JSON в приложении и вставьте содержимое файла. Либо используйте «Скопировать текст» для ручного описания. Ошибка, частичный результат и «не проверено» тоже подходят. Повторно заполнять поля ниже не нужно."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "app-version",
      "attributes": {
        "label": "Версия приложения (необязательно)",
        "description": "Если она уже есть в JSON, повторять не нужно. Укажите точную версию, например 0.2.7, либо «неизвестно»."
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "textarea",
      "id": "manual-details",
      "attributes": {
        "label": "Дополнительные сведения (необязательно)",
        "placeholder": "Модель / числовой ID:\nПрошивка / версия протокола:\nПодключение (BLE / другое / неизвестно):\nБумага (ширина × длина, тип, плотность):\nДата теста (UTC, если известна):\nДополнительное описание результата:",
        "description": "Только если чего-то нет в отчёте. Не добавляйте имя устройства или адрес Bluetooth."
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "dropdown",
      "id": "protocol-attempt",
      "attributes": {
        "label": "Попытка печати (необязательно)",
        "options": [
          "Не проверено / указано в отчёте",
          "not_run — не запускалась",
          "completed — протокол завершён, бумага ещё не подтверждена",
          "error — ошибка обмена; этикетка могла выйти",
          "cancelled — отменена; этикетка могла выйти"
        ],
        "default": 0
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "dropdown",
      "id": "observation-feed",
      "attributes": {
        "label": "Вышла ровно одна целая этикетка? (необязательно)",
        "options": [
          "not_checked — не проверено / указано в отчёте",
          "yes — да",
          "no — нет"
        ],
        "default": 0
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "dropdown",
      "id": "observation-text",
      "attributes": {
        "label": "Весь тестовый текст виден без обрезки? (необязательно)",
        "options": [
          "not_checked — не проверено / указано в отчёте",
          "yes — да",
          "no — нет"
        ],
        "default": 0
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "dropdown",
      "id": "observation-qr",
      "attributes": {
        "label": "QR прочитан как MIRA-D11H-TEST? (необязательно)",
        "options": [
          "not_checked — не проверено / указано в отчёте",
          "yes — да",
          "no — нет"
        ],
        "default": 0
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "input",
      "id": "test-spec",
      "attributes": {
        "label": "Методика теста (необязательно)",
        "value": "miralabel-print-check-v1",
        "description": "Для встроенной проверки приложения. Другую методику опишите в отчёте."
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "input",
      "id": "qr-payload",
      "attributes": {
        "label": "Ожидаемое содержимое QR (необязательно)",
        "value": "MIRA-D11H-TEST"
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "textarea",
      "id": "photo",
      "attributes": {
        "label": "Фото этикетки или комментарий (необязательно)",
        "description": "Можно перетащить фотографию сюда. Показывайте только тестовую этикетку, без личных данных. Фото не требуется для отправки."
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "checkboxes",
      "id": "public-consent",
      "attributes": {
        "label": "Публичная отправка",
        "options": [
          {
            "label": "Я понимаю, что отчёт и вложения будут публичными на GitHub, и проверил(а), что они не содержат личных данных, адресов устройств и серийных номеров.",
            "required": true
          }
        ]
      }
    }
  ]
}
