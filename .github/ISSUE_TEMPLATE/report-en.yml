{
  "name": "EN · NIIMBOT print check",
  "description": "Report success, a partial result, failure, or a test not yet performed.",
  "title": "[Print check] ",
  "labels": [
    "compatibility-report",
    "needs-review"
  ],
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Thank you for testing NIIMBOT. Paste the safe report generated by the app; you do not need to enter its fields again. For any model in the catalog, you can describe a result manually, including no print attempt or a connection failure. The app's built-in check currently targets D11H; its specification and QR do not automatically apply to other models. A protocol reply does not prove physical printing. A new Issue awaits review and never changes compatibility automatically.\n\n**This is a public GitHub form.** Do not include serial numbers, Bluetooth/MAC addresses, computer names, file paths, logs containing these details, or personal label content."
      }
    },
    {
      "type": "textarea",
      "id": "report",
      "attributes": {
        "label": "App report or manual description",
        "placeholder": "Paste the app JSON. Or describe: exact app version; model and numeric ID if known; firmware; protocol version; BLE/other connection; label size/type/density; test date; what you checked and the result. Write “not checked” for anything unknown. If you did not attempt printing or could not connect, say so.",
        "description": "Choose “Open GitHub form” in the app: its safe JSON will be filled in here. If it is missing, save JSON in the app and paste the file contents. Alternatively, use “Copy text” for a manual description. Failures, partial results, and “not checked” are welcome. You do not need to enter the fields below again."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "model",
      "attributes": {
        "label": "NIIMBOT model (optional)",
        "description": "Filled automatically when you open this form from the catalog. No need to repeat a model already in the JSON. Give the model and numeric ID if known; do not include an advertised device name or serial number."
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "input",
      "id": "app-version",
      "attributes": {
        "label": "App version (optional)",
        "description": "No need to repeat a value already in the JSON. Give an exact version, such as 0.2.7, or write “unknown”."
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "textarea",
      "id": "manual-details",
      "attributes": {
        "label": "Additional details (optional)",
        "placeholder": "Model / numeric model ID:\nFirmware / protocol version:\nConnection (BLE / other / unknown):\nMedia (width × length, type, density):\nTest date (UTC, if known):\nAdditional result details:",
        "description": "Only fill in information missing from your report. Do not include an advertised device name or Bluetooth address."
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "dropdown",
      "id": "protocol-attempt",
      "attributes": {
        "label": "Print attempt (optional)",
        "options": [
          "Not checked / already in report",
          "not_run — not attempted",
          "completed — protocol completed; physical output is unverified",
          "error — communication failed; a label may have printed",
          "cancelled — cancelled; a label may have printed"
        ],
        "default": 0
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "dropdown",
      "id": "observation-feed",
      "attributes": {
        "label": "Exactly one whole label produced? (optional)",
        "options": [
          "not_checked — not checked / already in report",
          "yes — yes",
          "no — no"
        ],
        "default": 0
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "dropdown",
      "id": "observation-text",
      "attributes": {
        "label": "All test text visible without clipping? (optional)",
        "options": [
          "not_checked — not checked / already in report",
          "yes — yes",
          "no — no"
        ],
        "default": 0
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "dropdown",
      "id": "observation-qr",
      "attributes": {
        "label": "QR decoded to its expected content? (optional)",
        "description": "MIRA-D11H-TEST applies only to the built-in D11H check. For another method, give the expected content below. Leave “not checked” if you did not check a QR code.",
        "options": [
          "not_checked — not checked / already in report",
          "yes — yes",
          "no — no"
        ],
        "default": 0
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "input",
      "id": "test-spec",
      "attributes": {
        "label": "Test specification (optional)",
        "description": "miralabel-print-check-v1 applies only to the built-in D11H check. For other models, describe your method in the report or leave this empty. No need to repeat a value already in the JSON."
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "input",
      "id": "qr-payload",
      "attributes": {
        "label": "Expected QR content (optional)",
        "description": "MIRA-D11H-TEST applies only to the built-in D11H check. For another test, give your own expected content. Leave empty if no QR was used or the value is already in the JSON."
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "textarea",
      "id": "photo",
      "attributes": {
        "label": "Label photo or comments (optional)",
        "description": "You may drag a photo here. Show only the test label, without personal information. A photo is not required to submit."
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "checkboxes",
      "id": "public-consent",
      "attributes": {
        "label": "Public submission",
        "options": [
          {
            "label": "I understand that the report and attachments will be public on GitHub, and I have checked that they contain no personal information, device addresses, or serial numbers.",
            "required": true
          }
        ]
      }
    }
  ]
}
